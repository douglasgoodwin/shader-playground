<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assembly — Shader Playground</title>
    <meta name="description" content="Five video layers assembled by an organizing still or video — each flat color area in the map plays a different source." />
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <nav id="nav">
      <a href="/playground/" class="back">Playground</a>
      <span class="title">Assembly</span>
    </nav>
    <button id="record-btn" aria-label="Record H.264 video (R)" data-tip="Record H.264 video — press R"></button>
    <button id="frame-btn" aria-label="Record PNG frame sequence for ProRes (P)" data-tip="Record one exact loop as a PNG sequence — press P"></button>
    <div id="frame-counter" class="hidden"></div>

    <div id="slot-panel">
      <div class="drop-row">
        <span class="drop-label">Organizing media</span>
        <div class="drop-zone" id="map-zone">
          Drop still or video
          <span class="drop-hint">flat color areas</span>
          <input type="file" id="map-input" accept="image/*,video/*" style="display:none;" />
        </div>
      </div>

      <div class="drop-row">
        <span class="drop-label">Sources</span>
        <div id="slot-rows"></div>
      </div>

      <p id="pick-hint">Click a slot's eyedropper, then click that color in the frame.</p>
    </div>

    <div id="sliders">
      <label>
        <span>Output size</span>
        <select id="format">
          <option value="1920x1080">1920 × 1080 (HD / Bijou)</option>
          <option value="1080x1920">1080 × 1920 (HD vertical)</option>
          <option value="3840x2160">3840 × 2160 (4K UHD)</option>
          <option value="3888x1080">3888 × 1080 (Spectra)</option>
        </select>
      </label>
      <label>
        <span>Active slots</span>
        <input type="range" id="slotCount" min="1" max="5" step="1" value="5" />
      </label>
      <label>
        <span>Tolerance</span>
        <input type="range" id="tolerance" min="0.01" max="1" step="0.005" value="0.25" />
      </label>
      <label>
        <span>Edge softness</span>
        <input type="range" id="softness" min="0.001" max="0.3" step="0.001" value="0.02" />
      </label>
      <label>
        <span>Source scale</span>
        <input type="range" id="scale" min="0.25" max="3" step="0.01" value="1" />
      </label>
      <label>
        <span>Loop length (s)</span>
        <input type="range" id="loopLength" min="1" max="60" step="0.5" value="4" />
      </label>
      <label>
        <span>Unmatched areas</span>
        <select id="unmatched">
          <option value="0">Black</option>
          <option value="1">Show the map</option>
        </select>
      </label>
      <label class="check">
        <input type="checkbox" id="chromaOnly" checked />
        <span>Match hue, ignore brightness</span>
      </label>
      <label class="check">
        <input type="checkbox" id="preview" />
        <span>Preview the map (V)</span>
      </label>
      <label class="check">
        <input type="checkbox" id="lockLoop" checked />
        <span>Stop MP4 after one loop</span>
      </label>
    </div>

    <script type="module" src="/src/assembly.js"></script>
  </body>
</html>
