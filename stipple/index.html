<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stipple — Voronoi (Lloyd's relaxation)</title>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <nav id="nav">
      <a href="/playground/" class="back">Playground</a>
    </nav>
    <button id="record-btn" title="Record video (R)"></button>

    <div id="mode-selector">
      <button data-mode="webcam" class="active"><span class="key">1</span> Webcam</button>
      <button data-mode="upload"><span class="key">2</span> Upload</button>
    </div>

    <div id="upload-controls" class="mode-controls">
      <div class="drop-zone" id="drop-zone">
        <p>Drop image or video<br><span style="font-size:11px; opacity:0.6;">or click to browse</span></p>
        <input type="file" id="file-input" accept="image/*,video/*" />
      </div>
      <div class="url-input">
        <input type="text" id="url-input" placeholder="Or paste image URL..." />
        <button id="load-url">Load</button>
      </div>
    </div>

    <div id="webcam-status" class="hidden">
      <p>Requesting webcam access...</p>
    </div>

    <div id="sliders">
      <label>
        <span>Points</span>
        <input type="range" id="points" min="500" max="15000" step="100" value="4000">
      </label>
      <label>
        <span>Dot size</span>
        <input type="range" id="dotSize" min="0.4" max="4" step="0.1" value="1.4">
      </label>
      <label>
        <span>Contrast</span>
        <input type="range" id="contrast" min="0.3" max="3" step="0.05" value="1.4">
      </label>
      <label>
        <span>Iterations / frame</span>
        <input type="range" id="iters" min="0" max="4" step="1" value="2">
      </label>
      <label>
        <span>Respawn</span>
        <input type="range" id="respawn" min="0" max="0.3" step="0.005" value="0.05">
      </label>
      <label class="check">
        <input type="checkbox" id="invert">
        <span>Invert</span>
      </label>
      <button id="restart-btn" type="button">Restart (space)</button>
    </div>

    <div id="loading" class="hidden">Loading...</div>

    <script type="module" src="/src/stipple.js"></script>
  </body>
</html>
